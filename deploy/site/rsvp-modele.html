    <!-- Polices de l'administration et de l'espace staff : chargées sans bloquer l'affichage -->
    <script>
      // Ouverture du site : sur l'accueil seulement, une fois par visite, jamais si « Réduire les animations » est activé.
      // Variante par défaut : « rideau » (tissu noir qui s'ouvre depuis le milieu). Retour arrière : mettre VARIANTE = "seuil"
      // (ancienne ouverture à deux battants) ou ajouter ?ouverture=seuil à l'adresse. Le contenu est chargé derrière : rien ne bloque la page.
      (function () {
        var VARIANTE = "rideau";
        var d = document.documentElement;
        d.classList.remove("s-anime", "ouverture-finie", "avec-ouverture", "ouv-rideau", "ouv-seuil", "ouv-pret", "ouv-sans-texture");
        try {
          var ok = location.pathname === "/" && !sessionStorage.getItem("heavent-splash-vu") && navigator.userAgent.indexOf("HeaventAdminApp") < 0
            && !matchMedia("(prefers-reduced-motion: reduce)").matches && !/[?&]sans-ouverture/.test(location.search);
          if (!ok) return;
          sessionStorage.setItem("heavent-splash-vu", "1");
          var rideau = (/[?&]ouverture=seuil/.test(location.search) ? "seuil" : VARIANTE) === "rideau";
          d.classList.add("avec-ouverture", rideau ? "ouv-rideau" : "ouv-seuil");
          var racine = function () { return document.getElementById("root"); };
          window.finOuverture = function (passer) { d.classList.add("ouverture-finie"); if (passer) d.classList.remove("avec-ouverture"); var r = racine(); if (r) r.removeAttribute("inert"); document.removeEventListener("keydown", echap); };
          // pendant l'ouverture, la page derrière n'est ni lue ni atteignable au clavier ; Échap passe l'ouverture
          var echap = function (e) { if (e.key === "Escape") window.finOuverture(true); };
          document.addEventListener("keydown", echap);
          var posee = function () { var r = racine(); if (r && !d.classList.contains("ouverture-finie")) r.setAttribute("inert", ""); };
          posee(); document.addEventListener("DOMContentLoaded", posee);
          // onglet masqué puis revenu après la fin prévue : on retire le rideau tout de suite
          var t0 = Date.now();
          document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && Date.now() - t0 > 2300) window.finOuverture(true); });
          if (!rideau) { setTimeout(window.finOuverture, 1500); return; }
          // Le tissu est préparé (deux images légères) avant de bouger ; sans lui, un tissu dégradé le remplace. Garde-fou : jamais plus de 3,6 s.
          var prets = 0, lance = false;
          var go = function (sans) { if (lance) return; lance = true; if (sans) d.classList.add("ouv-sans-texture"); d.classList.add("ouv-pret"); setTimeout(window.finOuverture, 2300); };
          ["g", "d"].forEach(function (c) {
            var im = new Image();
            im.onload = function () { if (++prets === 2) go(false); };
            im.onerror = function () { go(true); };
            im.src = "/ouvertures/site-rideau-" + c + ".webp";
          });
          setTimeout(function () { go(prets < 2); }, 700);
          setTimeout(window.finOuverture, 3600);
        } catch (e) { /* navigation privée : pas d'ouverture */ }
      })();
    </script>
