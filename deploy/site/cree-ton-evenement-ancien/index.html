    <script>
      // Ouverture « le seuil » : sur l'accueil seulement, une fois par visite, jamais si « Réduire les animations » est activé.
      // Elle dure 1,5 s, se touche pour passer, et ne bloque jamais le chargement de la page (balisage statique ci-dessous).
      (function () {
        var d = document.documentElement;
        d.classList.remove("s-anime", "ouverture-finie", "avec-ouverture");
        try {
          var ok = location.pathname === "/" && !sessionStorage.getItem("heavent-splash-vu") && navigator.userAgent.indexOf("HeaventAdminApp") < 0
            && !matchMedia("(prefers-reduced-motion: reduce)").matches && !/[?&]sans-ouverture/.test(location.search);
          if (!ok) return;
          sessionStorage.setItem("heavent-splash-vu", "1");
          d.classList.add("avec-ouverture");
          window.finOuverture = function (passer) { d.classList.add("ouverture-finie"); if (passer) d.classList.remove("avec-ouverture"); };
          setTimeout(window.finOuverture, 1500);
        } catch (e) { /* navigation privée : pas d'ouverture */ }
      })();
    </script>
